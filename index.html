<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link rel="stylesheet" href="styles.css">

    <title>God of War Ragnarok Store</title>
</head>
<body>

    <!-- ================= HEADER ================= -->
 <section class="header">
    <header>
        <h1>GOD OF WAR</h1>
        <p>El destino está escrito en sangre</p>
    </header>
 </section>
    


    <!-- ================= SECCIÓN JUEGOS ================= -->
    <section class="juegos">
        <h2>Videojuegos Disponibles</h2>

        <div class="contenedor-juegos">

            <!-- JUEGO 1 -->
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwNL-mVYEKQXoYSeZKuQf6Y286OTvD2vy7TL2sVHxoUZoX4qo-4AAyYKojsVcBReGmfK0HqTblFjKaBRkPah_RGb6qlAtU3bdu3fMveMac&s=10" alt="Ragnarok">
                <h3>God of War Ragnarok</h3>
            </div>

            <!-- JUEGO 2 -->
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxhtNtcO9tpHHWXvIi4Gpdq5S4-N5HqVA_5YqGxrmQ7cIOFMQfKQc-wGnIpBq46xr0k4mNyOJWobFdhCkgGbed6M8_gpYBvPC9KlkIZyuLlQ&s=10" alt="GOW 2018">
                <h3>God of War (2018)</h3>
            </div>

            <!-- JUEGO 3 -->
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2rDo2KbD2YnnW8I7tcWjJho-VmagDcp9xLjHlRCZh3eaqmLtPmKDelrE0zaZ_9jxv4H172qRlcvu0oc7-0e9asZdGCyH7XAvXEKO2YxdyAw&s=10" alt="GOW 3">
                <h3>God of War III</h3>
            </div>

        </div>
    </section>

    <!-- ================= VIDEOS ================= -->
    <section class="videos">
        <h2>Trailers y Gameplay</h2>

        <div class="contenedor-videos">

           
            
            <video controls>
                <source src="videos/videos1.mp4" type="video/mp4">
            </video>

           
            <video controls>
                <source src="videos/videos2.mp4" type="video/mp4">
            </video>

            
            <iframe 
                src="https://www.youtube.com/embed/EE-4GvjKcfs"
                allowfullscreen>
            </iframe>

        </div>
    </section>

    <!-- ================= FORMULARIO ================= -->
    <section class="formulario">
        <h2>Contacto</h2>

        <form action="gracias.html">

            <!-- VALIDACIÓN AUTOMÁTICA -->
            <input type="text" placeholder="Nombre" required>

            <input type="email" placeholder="Correo" required>

            <textarea placeholder="Mensaje" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>

</body>
</html>
